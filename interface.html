                            // Auto-scroll functions
                            function checkAutoScroll(mouseX, mouseY) {
                                const scrollThreshold = 80; // Activation area size
                                const scrollSpeed = 8; // Pixels per scroll step
                                
                                // Get viewport dimensions
                                const windowHeight = $(window).height();
                                const windowWidth = $(window).width();
                                
                                // Check vertical scrolling for main page
                                const scrollTop = $(window).scrollTop();
                                const documentHeight = $(document).height();
                                
                                let shouldScrollVertically = false;
                                let verticalDirection = 0;
                                
                                // Top edge - scroll up
                                if (mouseY < scrollThreshold && scrollTop > 0) {
                                    shouldScrollVertically = true;
                                    verticalDirection = -1;
                                    console.log('Auto-scroll UP triggered - mouseY:', mouseY, 'scrollTop:', scrollTop);
                                }
                                // Bottom edge - scroll down
                                else if (mouseY > windowHeight - scrollThreshold && scrollTop + windowHeight < documentHeight) {
                                    shouldScrollVertically = true;
                                    verticalDirection = 1;
                                    console.log('Auto-scroll DOWN triggered - mouseY:', mouseY, 'windowHeight:', windowHeight, 'threshold:', windowHeight - scrollThreshold);
                                }
                                
                                // Check horizontal scrolling for route cards
                                let shouldScrollHorizontally = false;
                                let horizontalDirection = 0;
                                let $routeContainer = null;
                                
                                // Find the route container under the mouse
                                const elementUnderMouse = document.elementFromPoint(mouseX, mouseY);
                                if (elementUnderMouse) {
                                    $routeContainer = $(elementUnderMouse).closest('.route-visualization-horizontal');
                                    
                                    if ($routeContainer.length > 0) {
                                        const containerRect = $routeContainer[0].getBoundingClientRect();
                                        const containerScrollLeft = $routeContainer.scrollLeft();
                                        const containerScrollWidth = $routeContainer[0].scrollWidth;
                                        const containerClientWidth = $routeContainer[0].clientWidth;
                                        
                                        // Left edge - scroll left
                                        if (mouseX - containerRect.left < scrollThreshold && containerScrollLeft > 0) {
                                            shouldScrollHorizontally = true;
                                            horizontalDirection = -1;
                                        }
                                        // Right edge - scroll right
                                        else if (containerRect.right - mouseX < scrollThreshold && 
                                                containerScrollLeft + containerClientWidth < containerScrollWidth) {
                                            shouldScrollHorizontally = true;
                                            horizontalDirection = 1;
                                        }
                                    }
                                }
                                
                                // Start or update auto-scrolling
                                if (shouldScrollVertically || shouldScrollHorizontally) {
                                    if (!isAutoScrolling) {
                                        startAutoScroll(verticalDirection, horizontalDirection, scrollSpeed, $routeContainer);
                                    }
                                } else {
                                    stopAutoScroll();
                                }
                            }
                            
                            function startAutoScroll(verticalDir, horizontalDir, speed, $container) {
                                stopAutoScroll(); // Clear any existing interval
                                isAutoScrolling = true;
                                
                                console.log('Starting auto-scroll - vertical:', verticalDir, 'horizontal:', horizontalDir);
                                
                                autoScrollInterval = setInterval(() => {
                                    // Vertical scrolling
                                    if (verticalDir !== 0) {
                                        const currentScroll = $(window).scrollTop();
                                        const newScroll = currentScroll + (verticalDir * speed);
                                        $(window).scrollTop(newScroll);
                                        // console.log('Vertical scroll:', currentScroll, '->', newScroll);
                                    }
                                    
                                    // Horizontal scrolling
                                    if (horizontalDir !== 0 && $container && $container.length > 0) {
                                        const currentScroll = $container.scrollLeft();
                                        const newScroll = currentScroll + (horizontalDir * speed);
                                        $container.scrollLeft(newScroll);
                                        // console.log('Horizontal scroll:', currentScroll, '->', newScroll);
                                    }
                                }, 16); // ~60fps for smooth scrolling
                            }
                            
                            function stopAutoScroll() {
                                if (autoScrollInterval) {
                                    clearInterval(autoScrollInterval);
                                    autoScrollInterval = null;
                                }
                                isAutoScrolling = false;
                            }
                        }
                        
                        // Function to add store from available/dropped sections to a route
                        function addStoreToRoute(storeData, targetRouteId, targetPosition, sourceType) {
                            
                            // Find the target route
                            const targetRoute = response.routes.find(r => String(r.route_id) === String(targetRouteId));
                            if (!targetRoute) {
                                console.error('Could not find target route with ID:', targetRouteId);
                                console.error('Available route IDs:', response.routes.map(r => r.route_id));
                                return;
                            }
                            
                            
                            
                            // Mark that this route has had stores added (for manually created routes)
                            if (targetRoute.manually_created && targetRoute.never_had_stores) {
                                targetRoute.never_had_stores = false;
                            }
                            
                            // Create the store object with proper structure
                            const newStore = {
                                store_id: storeData.store_id,
                                store_name: storeData.store_name,
                                store_address: storeData.store_address,
                                coordinates: storeData.coordinates,
                                demand: parseFloat(storeData.demand) || 0,
                                unloading_time_minutes: 20, // Default unloading time
                                travel_time_to_store_minutes: 0,
                                travel_distance_kilometers: 0,
                                cumulative_time_minutes: 0,
                                cumulative_distance_kilometers: 0,
                                cumulative_volume: 0,
                                stop_sequence: targetPosition
                            };
                            
                            
                            
                            // For empty routes (only warehouses), insert between the warehouses
                            // For routes with stores, insert at the specified position
                            const actualStores = targetRoute.stores.filter(store => store.store_id !== "WH");
                            let insertPosition;
                            
                            if (actualStores.length === 0) {
                                // Empty route: insert between first warehouse (index 0) and last warehouse (index 1)
                                insertPosition = 1;
                            } else {
                                // Route with stores: insert at the specified position + 1 (to account for first warehouse)
                                insertPosition = targetPosition + 1;
                            }
                            
                            console.log('Inserting store at position:', insertPosition, 'in route with', targetRoute.stores.length, 'total stops');
                            
                            // Insert the store at the calculated position
                            targetRoute.stores.splice(insertPosition, 0, newStore);
                            
                            // Update stop sequences for all stores
                            targetRoute.stores.forEach((store, index) => {
                                store.stop_sequence = index;
                            });
                            
                            console.log('Store added to route, recalculating...');
                            
                            // Remove the store from the source section
                            removeStoreFromSource(storeData.store_id, sourceType);
                            
                            try {
                                // Recalculate the target route

                                recalculateRoute(targetRoute);
                                
                                // Recalculate summary metrics

                                updateRouteBlockMetrics(targetRouteId);
                                
                            } catch (error) {
                                console.error('Error in addStoreToRoute:', error);
                                console.error('Error stack:', error.stack);
                                
                                // Revert the store addition if there was an error
                                console.log('Reverting store addition due to error...');
                                targetRoute.stores.splice(insertPosition, 1);
                                
                                // Re-add the store to its source section
                                if (sourceType === 'available') {
                                    addStoreToAvailableStores(storeData);

                        function moveStoreBetweenRoutes(sourceRouteId, storeId, targetRouteId, targetPosition) {

                            // Find the source and target routes in the response data
                            const sourceRoute = response.routes.find(r => r.route_id == sourceRouteId);

                            console.log('Looking for store ID:', storeId, 'Type:', typeof storeId);
                            
                            // Find and remove the store from source route
                            // Try both string and number comparison in case of type mismatch
                            let storeIndex = sourceRoute.stores.findIndex(s => s.store_id === storeId);
                            if (storeIndex === -1) {
                                // Try with string conversion
                                storeIndex = sourceRoute.stores.findIndex(s => String(s.store_id) === String(storeId));
                            }
                            if (storeIndex === -1) {
                                // Try with number conversion
                                storeIndex = sourceRoute.stores.findIndex(s => Number(s.store_id) === Number(storeId));
                            }
                            
                            if (storeIndex === -1) {
                                console.error('Store not found in source route:', storeId);
                                console.log('Store IDs in source route:', sourceRoute.stores.map(s => s.store_id));
                                return;
                            }
                            
                            console.log('Found store at index:', storeIndex, 'in route', sourceRouteId);
                            const store = sourceRoute.stores.splice(storeIndex, 1)[0];
                            console.log('Removed store:', store);
                            
                            // Calculate insertion index
                            let insertIndex;
                            
                            // Check if target route is empty (only warehouses)
                            const targetActualStores = targetRoute.stores.filter(store => store.store_id !== "WH");
                            
                            if (sourceRouteId == targetRouteId) {
                                // Same route: need to account for the removed store affecting positions
                                if (targetPosition === 0) {
                                    insertIndex = 1; // After warehouse
                                } else {
                                    // If we removed a store before the target position, adjust accordingly
                                    if (storeIndex < targetPosition + 1) {
                                        // Store was removed from before target position, so target position shifts down
                                        insertIndex = targetPosition; // No +1 needed because we already removed one
                                    } else {
                                        // Store was removed from after target position, position unchanged
                                        insertIndex = targetPosition + 1; // +1 because warehouse is at index 0
                                    }
                                }
                            } else {
                                // Different routes: handle empty routes specially
                                if (targetActualStores.length === 0) {
                                    // Target route is empty: insert between warehouses
                                    insertIndex = 1;
                                } else {
                                    // Target route has stores: normal calculation
                                    insertIndex = targetPosition === 0 ? 1 : targetPosition + 1; // +1 because warehouse is at index 0
                                }
                            }
                            
                            console.log('Inserting store at index:', insertIndex, 'in route', targetRouteId);

                            console.log('Starting route recalculation...');
                            
                            try {

                                console.log('Recalculating source route:', sourceRouteId);
                                recalculateRoute(sourceRoute);
                                
                                if (sourceRouteId != targetRouteId) {
                                    console.log('Recalculating target route:', targetRouteId);
                                    recalculateRoute(targetRoute);

                                // Update the route block metrics for both routes

                                updateRouteBlockMetrics(targetRouteId);
                                
                                console.log('Store move operation completed successfully');
                                
                                // Check if any routes became empty and should be removed
                                checkAndRemoveEmptyRoutes();
                                
                            } catch (error) {
                                console.error('Error during route recalculation:', error);
                                // Revert the move if there was an error
                                targetRoute.stores.splice(insertIndex, 1);
                                sourceRoute.stores.splice(storeIndex, 0, store);
                                updateSelectedRoutesDisplay();
                            }
                        }

                        // Function to recalculate route metrics
                        function recalculateRoute(route) {
                            console.log('Recalculating route for stores:', route.stores.map(s => s.store_id));
                            
                            // Get store IDs for distance calculation
                            const storeIds = route.stores.map(s => s.store_id);
                            console.log('Requesting distances for store IDs:', storeIds);
                            
                            // Check if we have all needed distances in cache
                            let allInCache = true;
                            const neededPairs = [];
                            for (let i = 1; i < route.stores.length; i++) {
                                const fromId = route.stores[i - 1].store_id;
                                const toId = route.stores[i].store_id;
                                const key = `${fromId}_${toId}`;
                                if (!distanceTimeCache[key]) {
                                    allInCache = false;
                                    neededPairs.push(key);
                                }
                            }
                            
                            if (allInCache && Object.keys(distanceTimeCache).length > 0) {
                                // Use cached data
                                console.log('All distances available in cache, using cached data');
                                const cachedDistances = [];
                                for (let i = 1; i < route.stores.length; i++) {
                                    const fromId = route.stores[i - 1].store_id;
                                    const toId = route.stores[i].store_id;
                                    const key = `${fromId}_${toId}`;
                                    const cached = distanceTimeCache[key];
                                    cachedDistances.push({
                                        from_store: fromId,
                                        to_store: toId,
                                        distance_km: cached.distance_km,
                                        time_minutes: cached.time_minutes
                                    });
                                }
                                updateRouteWithDistances(route, cachedDistances);
                            } else {
                                // Fetch from server and update cache
                                console.log('Missing cache data for pairs:', neededPairs, '- fetching from server');
                                $.ajax({
                                    url: '/get_store_distances',
                                    type: 'POST',
                                    contentType: 'application/json',
                                    data: JSON.stringify({ store_ids: storeIds }),
                                    async: false, // Make synchronous for now
                                    success: function(distanceData) {
                                        console.log('Distance API response:', distanceData);
                                        if (distanceData.success) {
                                            console.log('Using real distance data from server');
                                            // Update cache with new data
                                            distanceData.distances_times.forEach(item => {
                                                const key = `${item.from_store}_${item.to_store}`;
                                                distanceTimeCache[key] = {
                                                    distance_km: item.distance_km,
                                                    time_minutes: item.time_minutes
                                                };
                                            });
                                            updateRouteWithDistances(route, distanceData.distances_times);
                                        } else {
                                            console.error('Failed to get distances:', distanceData.error);
                                            console.log('Falling back to estimates');
                                            updateRouteWithEstimates(route);
                                        }
                                    },
                                    error: function(xhr, status, error) {
                                        console.error('AJAX error fetching distances:', error);
                                        console.error('Response text:', xhr.responseText);
                                        console.error('Status:', status);
                                        console.log('Falling back to estimates');
                                        updateRouteWithEstimates(route);
                                    }
                                });
                            }

                        // Function to calculate distance between two coordinates (Haversine formula)
                        function calculateDistance(lat1, lon1, lat2, lon2) {
                            const R = 6371; // Radius of the Earth in kilometers
                            const dLat = (lat2 - lat1) * Math.PI / 180;
                            const dLon = (lon2 - lon1) * Math.PI / 180;
                            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                                    Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                                    Math.sin(dLon/2) * Math.sin(dLon/2);
                            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
                            return R * c; // Distance in kilometers
                        }

                                                <strong>${driverName}</strong><br>
                                                ${startStore.store_name} → ${endStore.store_name}<br>
                                                Distance: ${distance.toFixed(1)} km<br>
                                                Time: ${timeMinutes.toFixed(0)} min
                                            </div>
                                        `;

                                        segment.bindPopup(popupContent);
                                        visibleLine.bindPopup(popupContent);

                                        addRouteLayer(segment);
                                        addRouteLayer(visibleLine);
                                    }
                                }
                            });
                            
                            // Add dropped stores to the map (only if visibility is enabled)
                            // Use UI section as source of truth instead of server response
                            const $droppedStoreItems = $('#droppedStoresContainer .store-item');
                            if (showDroppedStores && $droppedStoreItems.length > 0) {
                                
                                $droppedStoreItems.each(function() {
                                    const $store = $(this);
                                    const droppedStore = {
                                        store_id: $store.data('store-id'),
                                        store_name: $store.data('name'),
                                        volume: parseFloat($store.data('volume')) || 0,
                                        coordinates: {
                                            latitude: parseFloat($store.data('lat')),
                                            longitude: parseFloat($store.data('lng'))
                                        }
                                    };
                                    const lat = parseFloat(droppedStore.coordinates.latitude);
                                    const lng = parseFloat(droppedStore.coordinates.longitude);
                                    
                                    if (!isNaN(lat) && !isNaN(lng)) {
                                        allCoordinates.push([lat, lng]);
                                        
                                        // Create dropped store marker (gray X)
                                        const droppedIcon = L.divIcon({
                                            className: 'store-marker',
                                            html: `
                                                <div style="
                                                    width: 16px;
                                                    height: 16px;
                                                    background: #666666;
                                                    border: 1px solid #fff;
                                                    border-radius: 50%;
                                                    display: flex;
                                                    align-items: center;
                                                    justify-content: center;
                                                    color: white;
                                                    font-weight: bold;
                                                    font-size: 10px;
                                                    line-height: 1;
                                                    box-shadow: 0 0 2px rgba(0,0,0,0.3);
                                                ">
                                                    ✕
                                                </div>
                                            `,
                                            iconSize: [16, 16],
                                            iconAnchor: [8, 8],
                                            popupAnchor: [0, -14]
                                        });
                                        
                                        const droppedMarker = L.marker([lat, lng], {
                                            icon: droppedIcon
                                        }).addTo(map);
                                        
                                        // Add popup with dropped store info
                                        droppedMarker.bindPopup(`
                                            <div style="font-size: 0.85rem;">
                                                <strong>Dropped Store</strong><br>
                                                <strong>${droppedStore.store_name}</strong><br>
                                                ID: ${droppedStore.store_id}<br>
                                                Volume: ${droppedStore.volume}m³
                                            </div>
                                        `);
                                        
                                        // Add click handler to highlight store in dropped stores section
                                        droppedMarker.on('click', function() {
                                            highlightDroppedStore(droppedStore.store_id);
                                        });
                                        
                                        addRouteLayer(droppedMarker);
                                    }
                                });
                                

                            }
                            
                            // Add available stores to the map (only if there are actually available stores)
                            const availableStores = [];
                            const $availableStoreItems = $('#storesContainer .store-item');
                            
                            if (showAvailableStores && $availableStoreItems.length > 0) {
                                $availableStoreItems.each(function() {
                                    const $store = $(this);
                                    const storeData = {
                                        store_id: $store.data('store-id'),
                                        store_name: $store.data('name'),
                                        coordinates: {
                                            latitude: $store.data('lat'),
                                            longitude: $store.data('lng')
                                        },
                                        demand: parseFloat($store.data('volume')) || 0
                                    };
                                    
                                    if (storeData.store_id && !isNaN(storeData.coordinates.latitude) && !isNaN(storeData.coordinates.longitude)) {
                                        availableStores.push(storeData);
                                    }
                                });
                                
                                if (availableStores.length > 0) {
                                    
                                    
                                    availableStores.forEach(availableStore => {
                                        const lat = parseFloat(availableStore.coordinates.latitude);
                                        const lng = parseFloat(availableStore.coordinates.longitude);
                                        
                                        if (!isNaN(lat) && !isNaN(lng)) {
                                            allCoordinates.push([lat, lng]);
                                            
                                            // Create available store marker (green circle)
                                            const availableIcon = L.divIcon({
                                                className: 'store-marker',
                                                html: `
                                                    <div style="
                                                        width: 16px;
                                                        height: 16px;
                                                        background: #28a745;
                                                        border: 1px solid #fff;
                                                        border-radius: 50%;
                                                        display: flex;
                                                        align-items: center;
                                                        justify-content: center;
                                                        color: white;
                                                        font-weight: bold;
                                                        font-size: 10px;
                                                        line-height: 1;
                                                        box-shadow: 0 0 2px rgba(0,0,0,0.3);
                                                    ">
                                                        ●
                                                    </div>
                                                `,
                                                iconSize: [16, 16],
                                                iconAnchor: [8, 8],
                                                popupAnchor: [0, -14]
                                            });
                                            
                                            const availableMarker = L.marker([lat, lng], {
                                                icon: availableIcon
                                            }).addTo(map);
                                            
                                            // Add popup with available store info
                                            availableMarker.bindPopup(`
                                                <div style="font-size: 0.85rem;">
                                                    <strong>Available Store</strong><br>
                                                    <strong>${availableStore.store_name}</strong><br>
                                                    ID: ${availableStore.store_id}<br>
                                                    Volume: ${availableStore.demand}m³
                                                </div>
                                            `);
                                            
                                            // Add click handler to highlight store in available stores section
                                            availableMarker.on('click', function() {
                                                highlightAvailableStore(availableStore.store_id);
                                            });
                                            
                                            addRouteLayer(availableMarker);
                                        }
                                    });
                                    
                                } else {
                                }
                            } else {
                                
                            }
                            
                            // Only fit bounds on initial load or if map is at default zoom
                            // Preserve user's zoom and pan when updating routes
                            if (allCoordinates.length > 0) {
                                const currentZoom = map.getZoom();
                                const currentCenter = map.getCenter();
                                const defaultZoom = window.DEFAULT_MAP_ZOOM || 11;
                                const defaultLat = window.DEFAULT_MAP_CENTER_LAT || 56.9496;
                                const defaultLng = window.DEFAULT_MAP_CENTER_LNG || 24.1052;
                                
                                // Only auto-fit if map is at initial zoom level or if it's the first load
                                const isInitialView = currentZoom === defaultZoom && 
                                    Math.abs(currentCenter.lat - defaultLat) < 0.1 && 
                                    Math.abs(currentCenter.lng - defaultLng) < 0.1;
                                
                                if (isInitialView) {
                                    const bounds = L.latLngBounds(allCoordinates);
                                    map.fitBounds(bounds, { padding: [20, 20] });
                                }
                            }
                            
                            
                            
                            } catch (error) {
                                console.error('=== ERROR UPDATING MAP ===', error);
                                console.error('Error stack:', error.stack);
                            }
                        }
                        
                        // Make the local updateMap function available globally
                        window.updateMapFunction = updateMapLocal;
                        console.log('=== window.updateMapFunction exposed ===');

                        
                        // Function to update routes_ui.json file
                        function updateRoutesJson() {

                            // Use the authoritative dropped stores from in-memory response
                            const droppedStores = (response && response.dropped_stores) ? response.dropped_stores : [];
                            $.ajax({
                                url: '/update_routes',
                                type: 'POST',
                                contentType: 'application/json',
                                data: JSON.stringify({
                                    routes: response.routes,
                                    summary: response.summary,
                                    constraints: response.constraints,
                                    dropped_stores: droppedStores
                                }),
                                success: function(result) {

                                },
                                error: function(xhr, status, error) {
                                    console.error('Failed to update routes:', error, xhr.responseText);
                                }
                            });
                        }
                        
                        // Clear all stores from available stores section since they were all processed
                        $('#storesContainer').empty();
                        
                        // Now process dropped stores (after available stores are cleared)
                        processDroppedStores();
                        
                        // Update store counts
                        updateStoreCounts();
                        
                        
                        // Update map after clearing available stores to ensure no green markers are shown
                        updateMap();
                        
                        // Initialize drag and drop functionality for route blocks immediately after route generation
                        if (typeof setupDragAndDrop === 'function') {
                            setupDragAndDrop();
                        } else {
                            console.warn('setupDragAndDrop function not available');
                        }
                        
                        // Dropped stores are already updated by the unassigned stores processing above
                        // No need to reload them from response.dropped_stores since we want to preserve existing ones
                    },
                    error: function(xhr, status, error) {
                        let errorMsg = 'An error occurred while generating routes.';
                        if (xhr.responseJSON && xhr.responseJSON.error) {
                            errorMsg = xhr.responseJSON.error;
                        }
                        
                        // Remove the overlay
                        $('#addingRoutesOverlay').remove();
                        
                        // Don't clear existing results on error - just show error message
                        // If there are existing results, prepend error to them
                        if (response && response.routes && response.routes.length > 0) {
                            $('#result').prepend('<div class="alert alert-danger mb-3">' + errorMsg + '</div>');
                        } else {
                            // Only show placeholder if there are no existing results
                            showPlaceholderContent();
                            $('#result').prepend('<div class="alert alert-danger mb-3">' + errorMsg + '</div>');
                        }
                        
                        console.log('Route generation failed, existing results preserved');
                    },
                    complete: function() {
                        $('#generateRoutesSpinner').addClass('d-none');
                        $('#generateRoutesBtn').prop('disabled', false);
                    }
                });
            });

            // Add event listener for map expand button
            $(document).on('click', '#expandMapBtn', function() {
                toggleMapExpansion();
            });
            
            // Add event listeners for store visibility checkboxes
            $(document).on('change', '#showAvailableStoresCheck', function() {
                handleAvailableStoresVisibility();
            });
            
            $(document).on('change', '#showDroppedStoresCheck', function() {
                handleDroppedStoresVisibility();
            });
            
            // Add event listener for dropped store clicks (to highlight on map)
            $(document).on('click', '#droppedStoresContainer .store-item', function(e) {
                e.preventDefault();
                e.stopPropagation();
                
                const storeId = $(this).data('store-id');

                
                if (storeId) {
                    highlightDroppedStoreOnMap(storeId);
                }
            });
            
            // Add event listeners for bulk action buttons
            $(document).on('click', '#dropSelectedBtn', function(e) {
                e.preventDefault();
                e.stopPropagation();
                bulkDropStores();
            });
            
            $(document).on('click', '#makeAvailableBtn', function(e) {
                e.preventDefault();
                e.stopPropagation();
                bulkMakeAvailable();
            });
            
            // Add event listeners for select all buttons
            $(document).on('click', '#selectAllAvailableBtn', function(e) {
                e.preventDefault();
                e.stopPropagation();
                selectAllAvailableStores();
            });
            
            $(document).on('click', '#selectAllDroppedBtn', function(e) {
                e.preventDefault();
                e.stopPropagation();
                selectAllDroppedStores();
            });
            
            // Add event listener for available store clicks (to highlight on map)
            $(document).on('click', '#storesContainer .store-item', function(e) {
                e.preventDefault();
                e.stopPropagation();
                
                const storeId = $(this).data('store-id');

                
                if (storeId) {
                    highlightAvailableStoreOnMap(storeId);
                }
            });
            
            
            // Add event listener for store clicks in route details (to highlight store on map)
            $(document).on('click', '#selectedRouteInfo .store-block-small', function(e) {
                e.preventDefault();
                e.stopPropagation();
                
                const storeId = $(this).data('store-id');
                const routeId = $(this).data('route-id');

                
                if (storeId) {
                    highlightRouteStoreOnMap(storeId, routeId);
                }
            });
            
            // Add event listener for route header clicks in route details (to highlight entire route on map)
            $(document).on('click', '#selectedRouteInfo .driver-header-inline', function(e) {
                e.preventDefault();
                e.stopPropagation();
                
                const routeId = $(this).data('route-id');
                
                if (routeId) {
                    highlightRouteOnMap(routeId);
                }
            });
            
            // Initialize drag and drop functionality for available stores
            function initializeDragAndDrop() {
                
                let draggedElement = null;
                
                // Remove any existing event listeners to prevent duplicates
                $(document).off('dragstart.availableStores dragend.availableStores dragover.availableStores dragleave.availableStores drop.availableStores dragenter.availableStores');
                
                // Handle drag start for stores in available/dropped sections
                $(document).on('dragstart.availableStores', '.store-item', function(e) {
                    draggedElement = this;
                    $(this).addClass('dragging');
                    e.originalEvent.dataTransfer.effectAllowed = 'move';
                    
                });
                
                // Handle drag end
                $(document).on('dragend.availableStores', '.store-item', function(e) {
                    $(this).removeClass('dragging');
                    $('#storesContainer, #droppedStoresContainer').removeClass('drag-over');
                    draggedElement = null;
                    
                });
                
                // Handle drag over stores sections (for the background drop zones)
                $(document).on('dragover.availableStores', '#storesContainer, #droppedStoresContainer', function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    e.originalEvent.dataTransfer.dropEffect = 'move';
                    
                    // Clear all drag-over states
                    $('#storesContainer, #droppedStoresContainer').removeClass('drag-over');
                    
                    // Add drag-over state to this container
                    $(this).addClass('drag-over');
                });
                
                // Handle drag leave stores containers
                $(document).on('dragleave.availableStores', '#storesContainer, #droppedStoresContainer', function(e) {
                    // Only remove drag-over if we're actually leaving the element
                    if (!$(this)[0].contains(e.relatedTarget)) {
                        $(this).removeClass('drag-over');
                    }
                });
                
                // Handle drop on stores containers (for background drop zones)
                $(document).on('drop.availableStores', '#storesContainer, #droppedStoresContainer', function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    
                    if (!draggedElement) return false;
                    
                    // Determine which section we're dropping to
                    const isDroppedStoresSection = $(this).attr('id') === 'droppedStoresContainer';
                    
                    
                    
                    // Handle drops from available/dropped store sections
                    if ($(draggedElement).hasClass('store-item')) {
                        
                        const storeId = $(draggedElement).data('store-id');
                        const sourceSection = $(draggedElement).data('source');
                        
                        
                        
                        // Move store between sections
                        moveStoreBetweenSections(storeId, sourceSection, isDroppedStoresSection);
                        
                        // Update map to reflect changes
                        setTimeout(() => {
                            // Update available stores display
                            if (typeof displayAvailableStoresOnMap === 'function' && showAvailableStores) {
                                displayAvailableStoresOnMap();
                            }
                            // Update dropped stores display
                            if (typeof displayDroppedStoresOnMap === 'function' && showDroppedStores) {
                                displayDroppedStoresOnMap();
                            }
                        }, 100);
                    }
                    
                    // Clear drag-over states
                    $('#storesContainer, #droppedStoresContainer').removeClass('drag-over');
                    
                    return false;
                });
            }
            
            // Initialize drag and drop functionality
        initializeDragAndDrop();
        
        // Make toggleStoreSelection globally accessible
        window.toggleStoreSelection = function(checkbox, event) {
            // Prevent the store click event from firing but allow checkbox to work
            if (event) {
                event.stopPropagation();
                // Don't prevent default - let checkbox toggle naturally
            }
            
            const $storeItem = $(checkbox).closest('.store-item');
            
            // Use setTimeout to check state after the checkbox has toggled
            setTimeout(() => {
                if (checkbox.checked) {
                    $storeItem.addClass('selected');
                } else {
                    $storeItem.removeClass('selected');
                }
            }, 0);
        };
        
        // Function to get selected stores from a container
        function getSelectedStores(containerSelector) {
            const selectedStores = [];
            $(`${containerSelector} .store-item.selected`).each(function() {
                const $store = $(this);
                const storeData = {
                    store_id: $store.data('store-id') || $store.data('id'),
                    store_name: $store.data('name'),
                    coordinates: {
                        latitude: parseFloat($store.data('lat')),
                        longitude: parseFloat($store.data('lng'))
                    },
                    demand: parseFloat($store.data('volume')) || 0,
                    store_address: $store.find('.store-address').text() || ''
                };
                selectedStores.push(storeData);
            });
            return selectedStores;
        }
        
        // Function to clear all selections in a container
        function clearSelections(containerSelector) {
            $(`${containerSelector} .store-checkbox`).prop('checked', false);
            $(`${containerSelector} .store-item`).removeClass('selected');
        }
        
        // Function to bulk move stores from available to dropped
        function bulkDropStores() {
            const selectedStores = getSelectedStores('#storesContainer');
            
            if (selectedStores.length === 0) {
                alert('Please select stores to drop');
                return;
            }
            
            
            
            selectedStores.forEach(store => {
                // Remove from available stores
                $(`#storesContainer .store-item[data-store-id="${store.store_id}"]`).closest('.col-4').remove();
                
                // Add to dropped stores
                addStoreToDroppedStores(store, 'manual'); // User action
            });
            
            // Update store counts
            updateStoreCounts();
            
            // Update map
            setTimeout(() => {
                if (typeof displayAvailableStoresOnMap === 'function' && typeof showAvailableStores !== 'undefined' && showAvailableStores) {
                    displayAvailableStoresOnMap();
                }
                if (typeof displayDroppedStoresOnMap === 'function' && typeof showDroppedStores !== 'undefined' && showDroppedStores) {
                    displayDroppedStoresOnMap();
                }
            }, 100);
            
            
        }
        
        // Function to bulk move stores from dropped to available
        function bulkMakeAvailable() {
            const selectedStores = getSelectedStores('#droppedStoresContainer');
            
            if (selectedStores.length === 0) {
                alert('Please select stores to make available');
                return;
            }
            
            
            
            selectedStores.forEach(store => {
                // Remove from dropped stores
                $(`#droppedStoresContainer .store-item[data-store-id="${store.store_id}"]`).closest('.col-4').remove();
                
                // Add to available stores
                addStoreToAvailableStores(store);
            });
            
            // Update store counts
            updateStoreCounts();
            
            // Update map
            setTimeout(() => {
                if (typeof displayAvailableStoresOnMap === 'function' && typeof showAvailableStores !== 'undefined' && showAvailableStores) {
                    displayAvailableStoresOnMap();
                }
                if (typeof displayDroppedStoresOnMap === 'function' && typeof showDroppedStores !== 'undefined' && showDroppedStores) {
                    displayDroppedStoresOnMap();
                }
            }, 100);
            

        }
        
        // Function to select all stores in available section
        function selectAllAvailableStores() {
            
            $('#storesContainer .store-checkbox').each(function() {
                if (!this.checked) {
                    this.checked = true;
                    const $storeItem = $(this).closest('.store-item');
                    $storeItem.addClass('selected');
                }
            });
            
        }
        
        // Function to select all stores in dropped section
        function selectAllDroppedStores() {
            
            $('#droppedStoresContainer .store-checkbox').each(function() {
                if (!this.checked) {
                    this.checked = true;
                    const $storeItem = $(this).closest('.store-item');
                    $storeItem.addClass('selected');
                }
            });
            
        }
            
            
            // Initialize map after all functions are defined
            setTimeout(function() {
                if (typeof window.initializeMap === 'function') {
                    window.initializeMap();
                } else if (typeof initializeMap === 'function') {
                    initializeMap();
                } else {
                    // Define and call inline as fallback
                    try {
                        if (typeof L !== 'undefined') {
                            const fallbackCenterLat = window.DEFAULT_MAP_CENTER_LAT || 56.9496;
                            const fallbackCenterLng = window.DEFAULT_MAP_CENTER_LNG || 24.1052;
                            const fallbackZoom = window.DEFAULT_MAP_ZOOM || 11;
                            // Create map and assign to both local and global variables
                            map = L.map('map').setView([fallbackCenterLat, fallbackCenterLng], fallbackZoom);
                            window.map = map;
                            routeLayers = [];
                            window.routeLayers = routeLayers;
                            
                            L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
                                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/">CARTO</a>',
                                subdomains: 'abcd',
                                maxZoom: 19
                            }).addTo(map);
                        }
                    } catch (error) {
                        console.error('Error initializing map inline:', error);
                    }
                }
            }, 500);
        });
    </script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
